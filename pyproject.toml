[project]
name = "academic-research-skills-tools"
version = "3.23.2"
requires-python = ">=3.11"
dependencies = ["pyyaml", "ruamel.yaml>=0.17", "defusedxml"]

[dependency-groups]
dev = ["pytest", "jsonschema[format]", "openpyxl>=3.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["scripts", "tests"]
